[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

; 板子通过 ESP32-CAM-MB 底板(CH340)连接
upload_port = /dev/cu.usbserial-210
monitor_port = /dev/cu.usbserial-210
upload_speed = 460800

; AI-Thinker ESP32-CAM 带 PSRAM，用大 app 分区给摄像头/网络栈留空间
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
